[project]
name = "arg-designer"
version = "0.1.0"
description = "Autoregressive Graph Designer for Multi-Agent Systems"
requires-python = "=3.11"
dependencies = [
    # LLM / API
    "openai>=1.0.0",
    "tiktoken",
    "tenacity",
    "aiohttp",
    "httpx",
    # ML / Graph
    "torch>=2.0.0",
    "torch-geometric",
    "networkx",
    "numpy",
    "sentence-transformers",
    # Data
    "pandas",
    # Utilities
    "python-dotenv",
    "class-registry",
    "shortuuid",
    "tqdm",
    "loguru",
    "pydantic",
    "requests",
    "pyyaml",
    # Document readers
    "PyPDF2",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "markdown",
    "beautifulsoup4",
    "charset-normalizer",
    "pylatexenc",
    # Web / Search
    "arxiv",
    "wikipedia",
    "pytube",
    "google-api-python-client",
    # Code execution
    "astunparse",
    # Web server
    "fastapi",
    "setuptools>=82.0.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mas_framework", "experiment", "datasets"]

[tool.uv]
dev-dependencies = [
    "ipykernel",
    "jupyter",
]
