[project]
name = "arg-designer"
version = "0.1.0"
description = "Autoregressive Graph Designer for Multi-Agent Systems"
requires-python = ">=3.11"
dependencies = [
    # LLM / API
    "openai>=1.0.0",
    "tiktoken",
    "tenacity",
    "aiohttp",
    "httpx",
    # ML / Graph
    "torch==2.6.0",
    "torch-geometric",
    "networkx",
    "numpy",
    "sentence-transformers",
    # Data
    "pandas",
    # Utilities
    "python-dotenv",
    "class-registry",
    "shortuuid",
    "tqdm",
    "loguru",
    "pydantic",
    "requests",
    "pyyaml",
    # pkg_resources is provided by setuptools; pin below <71 because
    # setuptools >=71 removed it as a top-level module and class-registry
    # imports it directly via class_registry.entry_points.
    "setuptools>=60,<71",
    # Document readers
    "PyPDF2",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "markdown",
    "beautifulsoup4",
    "charset-normalizer",
    "pylatexenc",
    # Web / Search
    "arxiv",
    "wikipedia",
    "pytube",
    "google-api-python-client",
    # Code execution
    "astunparse",
    # Web server
    "fastapi",
    # HuggingFace direct inference (HPC / Slurm — no Ollama server required)
    "transformers>=4.46.1",
    "accelerate>=0.30.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

# ---------------------------------------------------------------------------
# Entry points — invoked via:  uv run <name> [extra args]
#   uv run cold-start  --dataset gsm8k --num_tasks 40
#   uv run rga        --phase collect --num_tasks 100
#   uv run rga        --phase train_rm
#   uv run rga        --phase train_policy --model_dir <dir>
# ---------------------------------------------------------------------------
[project.scripts]
cold-start = "experiment.cold_start:main_cli"
rga        = "experiment.rga:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mas_framework", "experiment", "datasets"]
